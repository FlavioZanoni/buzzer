services:
  buzzer:
    build: .
    volumes:
      # A named volume, NOT a ./data bind mount: Dokploy re-clones the repo
      # folder on every deploy, which wiped ./data and every room with it.
      # Holds data/buzzer.db (rooms + clue images) and data/backups.
      - buzzer-data:/app/data
    restart: unless-stopped

volumes:
  buzzer-data:
